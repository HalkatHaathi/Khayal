<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- fonts are added from main.jsx without blocking first paint (inline handlers would break the CSP) -->
    <noscript><link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@700&display=swap" rel="stylesheet" /></noscript>
    <link rel="preload" as="image" href="/logo.webp" />
    <!-- first-paint loader: plain HTML + CSS so it shows before any script runs; App.jsx fades it out once the catalogue is ready -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #fff; transition: opacity .6s cubic-bezier(.22, 1, .36, 1); }
      #boot.is-done { opacity: 0; pointer-events: none; }
      #boot img { width: 96px; height: 96px; object-fit: cover; animation: boot-pulse 2.4s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
    <title>KHYAL – Streetwear Fashion</title>
    <meta name="description" content="Khyal is a streetwear label built on craft and culture: hand-embroidered jackets, block-printed kurtas, limited-edition tees. Free shipping on orders of Rs. 15,000 and above." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KHYAL" />
    <meta property="og:title" content="KHYAL – Streetwear Fashion" />
    <meta property="og:description" content="Hand-embroidered jackets, block-printed kurtas and limited-edition tees." />
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading"><img src="/logo.webp" alt="" width="96" height="96" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
